name: Playwright Tests with Allure Report

on:
  push:
    branches:
      - main                # Triggers when code lands on main (via direct push or PR merge)
  pull_request:
    branches:
      - main                # Triggers *before* merging, when a PR targets the main branch
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write # Crucial: Allows the runner to publish to the gh-pages branch

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        continue-on-error: true # Ensures report generation runs even if tests fail

      - name: Generate Allure Report and Track History
        uses: simple-elf/allure-report-action@v1.11
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
